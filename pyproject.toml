[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-readmission"
version = "0.1.0"
description = "LSTM-CNN hybrid model for predicting 30-day ICU readmission from MIMIC-III data"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "tensorflow>=2.10,<2.16",
    "numpy>=1.21,<2.0",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "keras>=2.10,<3.0",
    "tqdm",
    "frozendict",
    "gensim>=4.0",
    "scispacy",
    "transformers",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*", "config*", "nlp*"]
